<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DDL · Canvas 作业提醒</title>
<style>
:root{font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#e6eaf3;background:#0e1421;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:1140px;margin:0 auto;padding:36px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:28px;margin:0 0 8px}h2{font-size:17px;margin:0 0 16px}.muted{color:#96a4bb;font-size:13px;line-height:1.7}button,input,select{font:inherit;border-radius:9px;padding:10px 13px;border:1px solid #35435b;background:#1b263a;color:#e6eaf3}button{cursor:pointer}button:hover{background:#2a3a55}button:disabled{opacity:.45;cursor:default}.primary{background:#b4f181;color:#152312;border:0;font-weight:650}.primary:hover{background:#c7ff9c}.actions{display:flex;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.stat,.panel{border:1px solid #28354a;background:#141e2e;border-radius:14px;padding:20px}.stat strong{display:block;font-size:32px;margin-top:6px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.toolbar{display:flex;gap:10px;margin-bottom:18px}.toolbar input{min-width:0;flex:1}#tasks{display:flex;flex-direction:column;gap:12px}.task{padding:18px;background:#192438;border:1px solid #2b3951;border-radius:12px;display:flex;gap:14px}.task input{margin-top:7px;accent-color:#b4f181;width:17px;height:17px}.task .content{flex:1;min-width:0}.task a{color:#e8efff;text-decoration:none;font-weight:600;overflow-wrap:anywhere}.task a:hover{text-decoration:underline}.task.done{opacity:.55}.countdown{color:#b4f181;font-size:17px;font-variant-numeric:tabular-nums;margin-top:10px}.late{color:#ff9b8f}.soon{color:#ffd68e}.changed{color:#ffd68e;font-size:12px;margin-top:8px}.empty{padding:48px 20px;text-align:center;color:#96a4bb}.status{padding:14px 18px;border:1px solid #344960;border-radius:10px;margin:18px 0;line-height:1.7;font-size:14px;white-space:pre-wrap}.error{border-color:#bd625b;color:#ffc0b9}.panel label{display:block;margin:14px 0 7px;font-size:13px}.panel input{width:100%}.panel .actions{margin-top:16px}aside .panel{margin-bottom:16px}.notice{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #2a3850;padding-top:12px;margin-top:12px}.badge{color:#b4f181;font-size:12px;letter-spacing:1px}#flash{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#34445c;padding:14px 24px;border-radius:10px;max-width:90%;z-index:9}details summary{cursor:pointer}.footer{margin-top:24px}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}header{align-items:flex-start;flex-direction:column}main{padding:24px 14px}}
</style>
<main>
<header><div><div class="badge">CANVAS / LOCAL</div><h1>把截止时间，放在眼前。</h1><div class="muted">本地缓存 · 实时倒计时 · 桌面提醒</div></div><div class="actions"><button id="start" class="primary">登录并同步</button><button id="confirm" hidden>登录完成，开始读取</button><button id="cancel" hidden>取消</button></div></header>
<div id="syncstatus" class="status" role="status"></div>
<div class="muted" id="freshness"></div>
<div class="stats"><div class="stat"><span class="muted">待完成</span><strong id="pending">0</strong></div><div class="stat"><span class="muted">未来 7 天截止</span><strong id="week">0</strong></div><div class="stat"><span class="muted">已逾期</span><strong id="overdue">0</strong></div></div>
<div class="layout"><section><div class="toolbar"><input id="search" aria-label="搜索课程或作业" placeholder="搜索课程或作业…"><select id="filter" aria-label="筛选"><option value="pending">待完成</option><option value="all">全部作业</option><option value="done">已完成</option><option value="undated">无截止时间</option></select></div><div id="tasks"></div></section>
<aside><section class="panel"><h2>同步与提醒设置</h2><label for="site">学校 Canvas 地址</label><input id="site" type="url" placeholder="https://canvas.example.edu"><label for="thresholds">提前提醒（小时，逗号分隔）</label><input id="thresholds" value="72,24,3"><div class="actions"><button id="save" class="primary">保存设置</button><button id="test">测试通知</button></div><p class="muted">完成 MFA 后回到本面板开始读取。缓存不会自动跟随 Canvas 更新，建议每天同步一次。</p><div id="notifyerror" class="muted" role="alert"></div></section>
<section class="panel"><h2>提醒记录</h2><div class="muted">记录会保留；Windows 专注模式可能隐藏弹窗。</div><div id="notices"></div></section>
<details class="panel"><summary>使用提示</summary><p class="muted">勾选作业可手动标记完成并停止提醒；不会修改 Canvas。关闭本页面后，后台运行期间仍会提醒。电脑关机或休眠期间无法通知，恢复后补发最近阶段的提醒。无截止日期的作业不会提醒。</p></details></aside></div>
<div class="footer muted">截止时间按本机时区显示：<span id="zone"></span>。倒计时实时更新，作业数据以最近一次成功同步为准。</div>
</main><div id="flash" hidden role="alert"></div>
<script>
const csrf='__CSRF__';let state=null,renderKey='',flashTimer;const $=id=>document.getElementById(id);
function flash(s){$('flash').textContent=s;$('flash').hidden=false;clearTimeout(flashTimer);flashTimer=setTimeout(()=>$('flash').hidden=true,6000)}
async function post(path,data={}){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
function fmt(s){return s?new Date(s).toLocaleString('zh-CN',{hour12:false}):'未设置截止时间'}
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
function drawTasks(){if(!state)return;const key=JSON.stringify([state.tasks,$('search').value,$('filter').value]);if(key===renderKey)return;renderKey=key;const box=$('tasks');box.replaceChildren();const q=$('search').value.trim().toLowerCase(),f=$('filter').value;
const tasks=state.tasks.filter(t=>(t.course+' '+t.title).toLowerCase().includes(q)&&(f==='all'||f==='pending'&&!t.done||f==='done'&&t.done||f==='undated'&&!t.due));
if(!tasks.length)box.append(node('div',state.tasks.length?'没有符合条件的作业。':'尚无缓存。填写 Canvas 地址，保存后登录并同步。','empty'));
for(const t of tasks){const card=node('article','','task'+(t.done?' done':''));const check=document.createElement('input');check.type='checkbox';check.checked=!!t.done;check.setAttribute('aria-label','标记完成：'+t.title);check.onchange=async()=>{try{await post('complete',{id:t.id,done:check.checked});await refresh()}catch(e){check.checked=!check.checked;flash(e.message)}};const content=node('div','','content');content.append(node('div',t.course,'muted'));const a=node('a',t.title);try{const u=new URL(t.url);if(u.protocol==='https:'){a.href=t.url;a.target='_blank';a.rel='noopener noreferrer'}}catch{}content.append(a,node('div',fmt(t.due),'muted'));const cd=node('div','','countdown');cd.dataset.due=t.due||'';content.append(cd);if(t.changed)content.append(node('div','截止时间已变更 · 原时间：'+fmt(t.previous_due),'changed'));card.append(check,content);box.append(card)}tick()}
function tick(){if(!state)return;const now=Date.now();for(const e of document.querySelectorAll('[data-due]')){if(!e.dataset.due){e.textContent='待确认截止时间';continue}const diff=new Date(e.dataset.due)-now;let s=Math.floor(Math.abs(diff)/1000);const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;e.textContent=(diff<0?'已逾期 ':'剩余 ')+(d?d+' 天 ':'')+`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;e.className='countdown'+(diff<0?' late':diff<86400000?' soon':'')}
const pending=state.tasks.filter(t=>!t.done);$('pending').textContent=pending.length;$('week').textContent=pending.filter(t=>t.due&&new Date(t.due)-now>0&&new Date(t.due)-now<=7*86400000).length;$('overdue').textContent=pending.filter(t=>t.due&&new Date(t.due)<now).length;
const age=state.last_sync?Date.now()-new Date(state.last_sync):0;$('freshness').textContent=state.last_sync?'最近同步：'+fmt(state.last_sync)+(age>86400000?' · 缓存超过 24 小时，请重新同步':''):'尚未成功同步';}
async function refresh(){try{const r=await fetch('/api/state');if(!r.ok)throw Error('读取状态失败');state=await r.json();if(!$('site').dataset.loaded){$('site').value=state.site;$('thresholds').value=state.thresholds.join(',');$('site').dataset.loaded=1}const p=state.sync.phase;$('syncstatus').textContent=state.sync.message;$('syncstatus').className='status'+(p==='error'?' error':'');$('start').disabled=['opening','login','syncing'].includes(p);$('confirm').hidden=p!=='login';$('cancel').hidden=!['opening','login','syncing'].includes(p);$('notifyerror').textContent=state.notification_error||'';const box=$('notices');box.replaceChildren();for(const n of state.notices)box.append(node('div',n.title+'\n'+n.body+'\n'+fmt(n.created),'notice'));drawTasks();tick()}catch(e){$('syncstatus').textContent='无法连接本地后台。请运行 start.ps1；倒计时仍基于已有数据。';$('syncstatus').className='status error'}}
function action(id,fn){$(id).onclick=async()=>{try{await fn();await refresh()}catch(e){flash(e.message)}}}
action('save',async()=>{await post('settings',{site:$('site').value,thresholds:$('thresholds').value.split(/[,，]/).map(x=>Number(x.trim()))});flash('设置已保存')});action('start',()=>post('sync/start'));action('confirm',()=>post('sync/confirm'));action('cancel',()=>post('sync/cancel'));action('test',async()=>{await post('notify/test');flash('已发送测试通知，请检查 Windows 通知中心')});$('search').oninput=drawTasks;$('filter').onchange=drawTasks;$('zone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone;refresh();setInterval(refresh,5000);setInterval(tick,1000);
</script></html>
